name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          for file in *.php; do
            php -l "$file"
          done

      - name: Check JavaScript syntax
        run: node --check js/app.js
