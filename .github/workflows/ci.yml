name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          for file in *.php; do
            php -l "$file"
          done

      - name: Check JavaScript syntax
        run: node --check js/app.js
